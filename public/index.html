<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Store Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Book Store Manager</h1>
    <p class="subtitle">Manage books (ID, Author, Price) via Express &amp; Fetch API</p>

    <!-- Response / Error Banner -->
    <div id="messageBox" class="message hidden" role="alert"></div>

    <!-- Add / Update Book Form -->
    <section class="card">
      <h2 id="formTitle">Add New Book</h2>
      <form id="bookForm">
        <input type="hidden" id="editingId" />

        <div class="form-group">
          <label for="authorInput">Author</label>
          <input type="text" id="authorInput" placeholder="e.g. Jane Austen" required />
        </div>

        <div class="form-group">
          <label for="priceInput">Price</label>
          <input type="number" id="priceInput" step="0.01" min="0" placeholder="e.g. 15.99" required />
        </div>

        <div class="actions">
          <button type="submit" id="submitBtn">Add Book</button>
          <button type="button" id="cancelEditBtn" class="secondary hidden">Cancel Edit</button>
        </div>
      </form>
    </section>

    <!-- Lookup Single Book by ID -->
    <section class="card">
      <h2>Find Book by ID</h2>
      <div class="inline-form">
        <input type="number" id="lookupIdInput" min="1" placeholder="Enter Book ID" />
        <button type="button" id="lookupBtn">Get Book</button>
        <button type="button" id="showAllBtn" class="secondary">Show All</button>
      </div>
    </section>

    <!-- Dynamic Book List -->
    <section class="card">
      <h2>Books List</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Book ID</th>
              <th>Author</th>
              <th>Price</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="booksTableBody">
            <tr>
              <td colspan="4">Loading books...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
